# Reusable workflow: Ktor API CI + coverage gate.
#
# Build (tests + detekt/ktlint via `build`) -> Kover XML/HTML reports ->
# coverage verification (>= coverage-min). It publishes a coverage summary to
# the job summary, posts/updates a PR comment, and uploads the Kover HTML report
# as an artifact. Docs-only PRs pass without running Gradle.
#
# Jobs:
#   secrets     gitleaks scan of the full git history (always runs).
#   migrations  squawk lint of the Supabase migrations changed in the PR
#               (mode=full only; skipped when no migration changed).
#   ktor-ci     build, tests and coverage gate (mode=full); in mode=deploy it
#               only assembles, so push runs do not repeat tests/coverage.
# Call it from a consumer repo with `uses:` (see ktor-api/README.md).
name: Ktor CI

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version (temurin)."
        type: string
        default: "21"
      coverage-min:
        description: "Minimum coverage percentage enforced by koverVerify."
        type: number
        default: 90
      working-directory:
        description: "Directory the Gradle build runs from."
        type: string
        default: "."
      gradle-tasks-extra:
        description: "Extra Gradle tasks/flags appended to the build invocation."
        type: string
        default: ""
      mode:
        description: "full (PR gate: tests, coverage, migrations lint) or deploy (push to main/release: assemble only)."
        type: string
        default: "full"
      migrations-path:
        description: "Directory (from the repo root) with the Supabase SQL migrations linted by squawk."
        type: string
        default: "supabase/migrations"
      pg-version:
        description: "Postgres major version of the Supabase project, used by squawk to pick valid rules."
        type: string
        default: "17"

# GITHUB_TOKEN only: read the code, write PR comments.
permissions:
  contents: read
  pull-requests: write

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ktor-ci-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --exit-code 1)
          # An optional consumer config extends the defaults (allowlists, custom rules).
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          # --redact masks every secret value in the output; findings show rule and location only.
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}" .

  migrations:
    name: migrations
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ktor-ci-migrations-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      SQUAWK_VERSION: "2.71.0"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed migrations
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          MIGRATIONS_PATH: ${{ inputs.migrations-path }}
        run: |
          set -euo pipefail
          dir="${MIGRATIONS_PATH%/}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # No fetch: credentials are not persisted, and fetch-depth 0 already
            # brought every remote branch, including the base.
            git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null \
              || { echo "::error::Base ref origin/$BASE_REF not found; cannot lint migrations"; exit 1; }
            range="origin/$BASE_REF...HEAD"
          elif [ -n "${EVENT_BEFORE:-}" ] && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            range="$EVENT_BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          # Only added/modified files: a deleted migration has nothing to lint.
          # No "|| true": a git error (bad range, missing ref) must fail the job, not look like "no changes".
          git diff --name-only --diff-filter=AM "$range" -- "$dir/*.sql" > "$RUNNER_TEMP/migrations.txt"
          # grep -c exits 1 when there are zero matches, which is the legitimate empty case.
          count=$(grep -c . "$RUNNER_TEMP/migrations.txt" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed migrations: $count"
          cat "$RUNNER_TEMP/migrations.txt"

      - name: Report no migration changes
        if: ${{ steps.changed.outputs.count == '0' }}
        run: echo "No migration changed in this run; squawk skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: ${{ steps.changed.outputs.count != '0' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install squawk
        if: ${{ steps.changed.outputs.count != '0' }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/squawk-venv"
          # Hashes of the squawk-cli 2.71.0 linux wheels, from the PyPI JSON metadata. Update together with SQUAWK_VERSION.
          cat > "$RUNNER_TEMP/squawk-requirements.txt" <<EOF
          squawk-cli==${SQUAWK_VERSION} \\
            --hash=sha256:421aed4ea504ebfccff1c04872067adc36b0c4cd0962334f8aa08e842302d89b \\
            --hash=sha256:157d2377a53e16f401b662b9b8bab6e46a326b2774516a4c6957cc5f8ab6de21
          EOF
          "$RUNNER_TEMP/squawk-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "$RUNNER_TEMP/squawk-requirements.txt"

      - name: Lint changed migrations with squawk
        if: ${{ steps.changed.outputs.count != '0' }}
        env:
          PG_VERSION: ${{ inputs.pg-version }}
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/migrations.txt"
          # A .squawk.toml at the repo root is picked up automatically.
          "$RUNNER_TEMP/squawk-venv/bin/squawk" --pg-version="$PG_VERSION" "${files[@]}"

  ktor-ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ktor-ci-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            full|deploy) ;;
            *) echo "::error::Invalid mode '$MODE' (expected full or deploy)"; exit 1 ;;
          esac

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Full history so docs-only detection can diff against the PR base ref.
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "${EVENT_BEFORE:-}" ] && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$EVENT_BEFORE" HEAD)
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"
          echo "$files"
          docs_only=true
          if [ -z "$files" ]; then
            # No diff detected (e.g. first push): run the full pipeline.
            docs_only=false
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.claude/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $docs_only"

      - name: Report docs-only skip
        if: ${{ steps.changes.outputs.docs_only == 'true' }}
        run: |
          {
            echo "## Ktor CI"
            echo
            echo "Docs-only change detected (\`*.md\`, \`docs/**\`, \`.claude/**\`)."
            echo "Gradle build and coverage gate were skipped; the check passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        # Cache is read-only outside the default branch (action default), so PRs
        # reuse the cache written by pushes to main without polluting it.
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble (deploy mode)
        if: ${{ steps.changes.outputs.docs_only != 'true' && inputs.mode == 'deploy' }}
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew assemble

      - name: Build, test and generate coverage reports
        if: ${{ steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' }}
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew build koverXmlReport koverHtmlReport ${{ inputs.gradle-tasks-extra }}

      - name: Coverage summary and PR comment
        if: ${{ !cancelled() && steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          COVERAGE_PARSER: |
            import sys
            import xml.etree.ElementTree as ET

            report_path, minimum = sys.argv[1], float(sys.argv[2])
            root = ET.parse(report_path).getroot()


            def coverage_for(counter_type):
                # Kover emits JaCoCo-style <counter type= missed= covered=> at report level.
                for counter in root.findall("counter"):
                    if counter.get("type") == counter_type:
                        missed = int(counter.get("missed", "0"))
                        covered = int(counter.get("covered", "0"))
                        total = missed + covered
                        pct = (100.0 * covered / total) if total else 100.0
                        return pct, covered, total
                return None


            print("## Ktor CI coverage")
            print()
            print("Minimum required: **{:.0f}%**".format(minimum))
            print()
            print("| Metric | Covered | Total | Coverage |")
            print("|--------|---------|-------|----------|")
            for label, key in (("Line", "LINE"), ("Branch", "BRANCH"), ("Instruction", "INSTRUCTION")):
                data = coverage_for(key)
                if data is None:
                    continue
                pct, covered, total = data
                mark = "white_check_mark" if pct >= minimum else "x"
                print("| {} | {} | {} | {:.2f}% :{}: |".format(label, covered, total, pct, mark))
        run: |
          set -euo pipefail
          report=$(find . -type f -path '*reports/kover/*.xml' | head -n1 || true)
          body="$RUNNER_TEMP/coverage.md"
          if [ -z "$report" ]; then
            {
              echo "## Ktor CI coverage"
              echo
              echo "No Kover XML report was found. Ensure \`koverXmlReport\` runs in the build."
            } > "$body"
          else
            python3 -c "$COVERAGE_PARSER" "$report" "$COVERAGE_MIN" > "$body"
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$body" --edit-last \
              || gh pr comment "$PR_NUMBER" --body-file "$body"
          fi

      - name: Upload Kover HTML report
        if: ${{ !cancelled() && steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: ${{ inputs.working-directory }}/**/build/reports/kover/html
          if-no-files-found: ignore

      - name: Verify coverage gate
        if: ${{ steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' }}
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew koverVerify -PkoverMinCoverage=${{ inputs.coverage-min }}
