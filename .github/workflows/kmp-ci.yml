# Reusable workflow: Kotlin Multiplatform PR CI + coverage gate.
#
# Runs on Linux and covers every target that a Linux runner can build: Android,
# the JVM/desktop target and the shared commonTest sources. Coverage is measured
# with Kover (which aggregates all measurable KMP targets) and enforced by
# koverVerify at the configured minimum. The iOS targets need macOS and live in
# the separate, optional kmp-ios.yml.
#
# Jobs:
#   secrets  gitleaks scan of the full git history (always runs).
#   kmp-ci   full gate (mode=full) or only the Android assemble (mode=deploy),
#            so push runs to main/release do not repeat tests/coverage.
#
# Call it from a consumer repo with `uses:` (see kmp/README.md).
name: KMP CI

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version."
        type: string
        default: "21"
      coverage-min:
        description: "Minimum aggregated coverage percentage enforced by koverVerify."
        type: number
        default: 90
      working-directory:
        description: "Directory that holds the Gradle build."
        type: string
        default: "."
      mode:
        description: "full (PR gate: lint, tests, coverage) or deploy (push to main/release: assemble only)."
        type: string
        default: "full"

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: kmp-ci-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --exit-code 1)
          # An optional consumer config extends the defaults (allowlists, custom rules).
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          # --redact masks every secret value in the output; findings show rule and location only.
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}" .

  kmp-ci:
    runs-on: ubuntu-latest
    concurrency:
      group: kmp-ci-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate mode
        working-directory: .
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            full|deploy) ;;
            *) echo "::error::Invalid mode '$MODE' (expected full or deploy)"; exit 1 ;;
          esac

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Full history so the docs-only diff can reach the PR base ref.
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
                       || git diff --name-only HEAD~1 HEAD)"
          fi
          echo "Changed files:"
          echo "$changed"
          # Keep only files that are NOT docs: anything that remains means code ran.
          code="$(printf '%s\n' "$changed" \
                  | grep -vE '(^|/)[^/]+\.md$|^docs/|^\.claude/' || true)"
          if [ -n "$changed" ] && [ -z "$code" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only docs changed - Gradle steps will be skipped."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: steps.changes.outputs.docs_only != 'true'
        # Cache is read-only outside the default branch (action default), so PRs
        # reuse the cache written by pushes to main without polluting it.
        uses: gradle/actions/setup-gradle@v4

      - name: Android build
        if: steps.changes.outputs.docs_only != 'true'
        run: ./gradlew assembleDebug

      - name: Android lint
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew lintDebug

      - name: Static analysis (detekt + ktlint)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew detekt ktlintCheck

      - name: Unit tests (commonTest / JVM / Android)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew jvmTest testDebugUnitTest

      - name: Konsist tests
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew konsistTest

      - name: Desktop build
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew :desktopApp:assemble

      - name: Coverage report (Kover)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Coverage gate (koverVerify)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        # The consumer's koverVerify rule reads this property for its minimum.
        run: ./gradlew koverVerify -Pkover.coverageThreshold=${{ inputs.coverage-min }}

      - name: Coverage summary
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          REPORT: ${{ inputs.working-directory }}/build/reports/kover/report.xml
        run: |
          python3 - "$REPORT" "$COVERAGE_MIN" > "$RUNNER_TEMP/coverage.md" <<'PY'
          import sys, xml.etree.ElementTree as ET

          report, minimum = sys.argv[1], float(sys.argv[2])
          covered = missed = 0
          try:
              root = ET.parse(report).getroot()
              for counter in root.findall("counter"):
                  if counter.get("type") == "LINE":
                      covered = int(counter.get("covered", 0))
                      missed = int(counter.get("missed", 0))
          except (OSError, ET.ParseError):
              print("### KMP coverage\n\nNo Kover report found.")
              sys.exit(0)

          total = covered + missed
          pct = (covered / total * 100) if total else 0.0
          status = "passed" if pct >= minimum else "FAILED"
          print("### KMP coverage (aggregated, Kover)\n")
          print(f"| Metric | Value |")
          print(f"| --- | --- |")
          print(f"| Line coverage | {pct:.2f}% |")
          print(f"| Minimum | {minimum:.0f}% |")
          print(f"| Gate | {status} |")
          PY
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --body-file "$RUNNER_TEMP/coverage.md" \
          || gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$RUNNER_TEMP/coverage.md"

      - name: Docs-only summary
        if: steps.changes.outputs.docs_only == 'true'
        working-directory: .
        run: |
          echo "Docs-only change: Gradle build, tests and coverage gate skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kover HTML report
        # Current v4 family, consistent with the other actions here; not pinned
        # in android-pr-gate.yml, so the latest major is used.
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: ${{ inputs.working-directory }}/build/reports/kover/html/
          if-no-files-found: ignore

      - name: Upload Roborazzi diff report
        # Roborazzi writes *_actual.png and *_compare.png here when a verify
        # fails. Limited to that path so nothing else (e.g. secrets) is uploaded;
        # consumers without Roborazzi simply match no files.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: "**/build/outputs/roborazzi/**"
          if-no-files-found: ignore
          retention-days: 7
