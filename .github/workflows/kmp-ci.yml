# Reusable workflow: Kotlin Multiplatform PR CI + coverage gate.
#
# Runs on Linux and covers every target that a Linux runner can build: Android,
# the JVM/desktop target and the shared commonTest sources. Coverage is measured
# with Kover (which aggregates all measurable KMP targets) and enforced by
# koverVerify at the configured minimum. The iOS targets need macOS and live in
# the separate, optional kmp-ios.yml.
#
# A single job (kmp-ci) runs as a pipeline, cheapest step first, stopping at the
# first failure: gitleaks (always runs) -> Gradle in one invocation (mode=full:
# lint, tests, konsist, builds, coverage gate) or only the Android assemble
# (mode=deploy), so push runs to main/release do not repeat tests/coverage.
#
# Call it from a consumer repo with `uses:` (see kmp/README.md).
name: KMP CI

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version."
        type: string
        default: "21"
      coverage-min:
        description: "Minimum aggregated coverage percentage enforced by koverVerify."
        type: number
        default: 90
      working-directory:
        description: "Directory that holds the Gradle build."
        type: string
        default: "."
      mode:
        description: "full (PR gate: lint, tests, coverage) or deploy (push to main/release: assemble only)."
        type: string
        default: "full"
      configuration-cache:
        description: "Pass --configuration-cache to the full-mode Gradle invocation. Enable only if the project supports it."
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  kmp-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kmp-ci-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate mode
        working-directory: .
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            full|deploy) ;;
            *) echo "::error::Invalid mode '$MODE' (expected full or deploy)"; exit 1 ;;
          esac

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks and the docs-only diff can reach the base ref.
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: .
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan commits for secrets
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          args=(git --redact --no-banner --exit-code 1 --report-format json --report-path "$report")
          # An optional consumer config extends the defaults (allowlists, custom rules).
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          # PR: only the commits of the PR. Push: only the new commits. A new branch
          # (zeroed or unknown "before") scans the full history.
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null; then
            args+=("--log-opts=origin/${BASE_REF}...HEAD")
          elif [ "$EVENT_NAME" != "pull_request" ] && [ -n "${EVENT_BEFORE:-}" ] \
            && ! printf '%s' "$EVENT_BEFORE" | grep -Eq '^0+$' \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            args+=("--log-opts=${EVENT_BEFORE}..HEAD")
          fi
          rc=0
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}" . || rc=$?
          if [ "$rc" -ne 0 ]; then
            # --verbose is avoided on purpose: it prints Match/Secret. Only the fields
            # below are extracted from the JSON report, never Match, Secret or Description.
            if [ -s "$report" ]; then
              # tojson escapes control characters (a file name may contain a newline), so no
              # printed line can start with "::" and be run as a workflow command.
              jq -r '.[] | "RuleID=\(.RuleID|tojson) File=\(.File|tojson) Line=\(.StartLine|tonumber? // 0) Commit=\(.Commit|tojson) Fingerprint=\(.Fingerprint|tojson)"' "$report" || true
            else
              echo "no gitleaks report produced"
            fi
            echo "::error::gitleaks failed (exit $rc). To allowlist a false positive see https://github.com/matheusbrum11/actions-workflows/blob/main/ktor-api/README.md#secrets--gitleaks"
            exit "$rc"
          fi

      - name: Detect code changes
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
                       || git diff --name-only HEAD~1 HEAD)"
          fi
          echo "Changed files:"
          echo "$changed"
          # Keep only files that are NOT docs: anything that remains means code ran.
          code="$(printf '%s\n' "$changed" \
                  | grep -vE '(^|/)[^/]+\.md$|^docs/|^\.claude/' || true)"
          if [ -n "$changed" ] && [ -z "$code" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only docs changed - Gradle steps will be skipped."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: steps.changes.outputs.docs_only != 'true'
        # Written by pushes to main and release/**; PRs (whose base is release/**) only read it.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

      - name: Android build (deploy mode)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'deploy'
        run: ./gradlew assembleDebug

      - name: Gradle gate (lint, tests, build, coverage)
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        env:
          GRADLE_FLAGS: ${{ inputs.configuration-cache && '--configuration-cache' || '' }}
        # One invocation pays the project configuration once. Tasks are listed cheapest
        # first: lint, tests, konsist, builds, then coverage. --continue reports every
        # failure instead of hiding later ones. The consumer's koverVerify rule reads
        # kover.coverageThreshold for its minimum.
        run: |
          ./gradlew --continue $GRADLE_FLAGS \
            detekt ktlintCheck lintDebug \
            jvmTest testDebugUnitTest konsistTest \
            assembleDebug :desktopApp:assemble \
            koverXmlReport koverHtmlReport koverVerify \
            -Pkover.coverageThreshold=${{ inputs.coverage-min }}

      - name: Coverage summary
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          REPORT: ${{ inputs.working-directory }}/build/reports/kover/report.xml
        run: |
          python3 - "$REPORT" "$COVERAGE_MIN" > "$RUNNER_TEMP/coverage.md" <<'PY'
          import sys, xml.etree.ElementTree as ET

          report, minimum = sys.argv[1], float(sys.argv[2])
          covered = missed = 0
          try:
              root = ET.parse(report).getroot()
              for counter in root.findall("counter"):
                  if counter.get("type") == "LINE":
                      covered = int(counter.get("covered", 0))
                      missed = int(counter.get("missed", 0))
          except (OSError, ET.ParseError):
              print("### KMP coverage\n\nNo Kover report found.")
              sys.exit(0)

          total = covered + missed
          pct = (covered / total * 100) if total else 0.0
          status = "passed" if pct >= minimum else "FAILED"
          print("### KMP coverage (aggregated, Kover)\n")
          print(f"| Metric | Value |")
          print(f"| --- | --- |")
          print(f"| Line coverage | {pct:.2f}% |")
          print(f"| Minimum | {minimum:.0f}% |")
          print(f"| Gate | {status} |")
          PY
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --body-file "$RUNNER_TEMP/coverage.md" \
          || gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$RUNNER_TEMP/coverage.md"

      - name: Docs-only summary
        if: steps.changes.outputs.docs_only == 'true'
        working-directory: .
        run: |
          echo "Docs-only change: Gradle build, tests and coverage gate skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kover HTML report
        # Current v4 family, consistent with the other actions here; not pinned
        # in android-pr-gate.yml, so the latest major is used.
        if: steps.changes.outputs.docs_only != 'true' && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: ${{ inputs.working-directory }}/build/reports/kover/html/
          if-no-files-found: ignore

      - name: Upload Roborazzi diff report
        # Roborazzi writes *_actual.png and *_compare.png here when a verify
        # fails. Limited to that path so nothing else (e.g. secrets) is uploaded;
        # consumers without Roborazzi simply match no files.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: "**/build/outputs/roborazzi/**"
          if-no-files-found: ignore
          retention-days: 7
