# Example caller — copy into your project at `.github/workflows/cd-release.yml`.
#
# Runs on every merge to main: computes the next semantic version from the
# commits, builds a signed AAB, ships it to Google Play, and tags the release.
# Pin @main to a tag (e.g. @v1) in production.
name: CD Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # the reusable workflow creates the release tag

jobs:
  release:
    uses: matheusbrum11/actions-workflows/.github/workflows/android-cd-release.yml@main
    with:
      package-name: "com.acme.app"          # your Play package name
      track: "internal"                      # internal | alpha | beta | production
      version-code-strategy: "run_number"    # or "commit_count"
      # bundle-task: "bundleDemoRelease"      # override if you use flavors
      # default-bump: "patch"
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
